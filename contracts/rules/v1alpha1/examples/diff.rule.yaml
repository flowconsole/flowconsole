apiVersion: rules.flowconsole.io/v1alpha1
kind: RuleFile
rules:
  - id: no-removed-service-components
    name: Removed service components are forbidden
    kind: diff
    target: diff
    severity: error
    blocking: true
    description: В diff-проекции не должно быть удалённых сервисных компонентов.
    enabled: true
    tags:
      - drift
      - diff
    sourceFamilies:
      - code
      - infra
    subject:
      entity: diffItems
      kinds:
        - Service
        - Application
        - Worker
      where: item.changeKind == "removed"
    changeKinds:
      - removed
    mode: aggregate
    let:
      removedCount: count(items)
    assert: removedCount == 0
    message: В diff-проекции обнаружены удалённые сервисные компоненты

apiVersion: rules.flowconsole.tech/v1alpha1
kind: RuleFile
rules:
  - id: bad-changekinds
    name: ChangeKinds on non-diff target
    kind: element
    target: actual
    severity: error
    blocking: true
    subject:
      entity: elements
    changeKinds:
      - removed
    assert: "true"
    message: Should fail

name: CLI Preview Release

on:
  push:
    branches: [dev]
    paths:
      - "engine/**"
      - "packages/cli/**"
  workflow_dispatch:

concurrency:
  group: cli-preview
  cancel-in-progress: true

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Skip @flowconsole/cli postinstall download (chicken-and-egg in CI:
  # the binary we're about to build doesn't exist on GitHub Releases yet).
  FLOWCONSOLE_CLI_SKIP_DOWNLOAD: "1"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      npm_version: ${{ steps.compute.outputs.npm_version }}
      cli_version: ${{ steps.compute.outputs.cli_version }}
      tag: ${{ steps.compute.outputs.tag }}
      no_changes: ${{ steps.changeset.outputs.no_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate preview changeset from git history
        id: changeset
        run: |
          bash .github/scripts/generate-preview-changeset.sh \
            --package @flowconsole/cli \
            --paths 'engine' 'packages/cli' \
            --tag-pattern 'cli-v*'

      - name: Check for changes
        if: steps.changeset.outputs.no_changes == 'true'
        run: |
          echo "No CLI changes since last preview tag. Skipping build."

      - name: Generate snapshot versions
        if: steps.changeset.outputs.no_changes != 'true'
        run: pnpm changeset version --snapshot beta

      - name: Compute versions
        if: steps.changeset.outputs.no_changes != 'true'
        id: compute
        run: |
          NPM_VERSION=$(node -p "require('./packages/cli/package.json').version")
          echo "npm_version=${NPM_VERSION}" >> "$GITHUB_OUTPUT"

          CLI_BASE=$(node -p "
            const pkg = require('./packages/cli/package.json');
            if (!pkg.cliVersion) { process.stderr.write('ERROR: cliVersion missing from packages/cli/package.json\n'); process.exit(1); }
            pkg.cliVersion.replace(/-.*/, '')
          ")
          SNAPSHOT_SUFFIX="${NPM_VERSION##*-beta-}"
          if [[ "$SNAPSHOT_SUFFIX" == "$NPM_VERSION" ]]; then
            echo "ERROR: could not extract snapshot suffix from '${NPM_VERSION}'" >&2
            exit 1
          fi
          CLI_VERSION="${CLI_BASE}-beta-${SNAPSHOT_SUFFIX}"
          echo "cli_version=${CLI_VERSION}" >> "$GITHUB_OUTPUT"

          TAG="cli-v${CLI_VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          echo "npm_version=${NPM_VERSION}"
          echo "cli_version=${CLI_VERSION}"
          echo "tag=${TAG}"

      - name: Upload preview notes
        if: steps.changeset.outputs.no_changes != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: preview-notes
          path: preview-notes.md

  build:
    needs: version
    if: needs.version.outputs.no_changes != 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz
          - os: ubuntu-latest
            rid: linux-arm64
            archive: tar.gz
          - os: macos-latest
            rid: osx-x64
            archive: tar.gz
          - os: macos-14
            rid: osx-arm64
            archive: tar.gz
          - os: windows-latest
            rid: win-x64
            archive: zip
          - os: windows-latest
            rid: win-arm64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish SFA binary
        shell: bash
        run: |
          dotnet publish engine/src/FlowConsole.Cli/FlowConsole.Cli.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            "-p:Version=${CLI_VERSION}" \
            -o publish/${{ matrix.rid }}
        env:
          CLI_VERSION: ${{ needs.version.outputs.cli_version }}

      - name: Create archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd publish/${{ matrix.rid }}
          tar -czf ../../fcon-${{ matrix.rid }}.${{ matrix.archive }} .

      - name: Create archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath fcon-${{ matrix.rid }}.${{ matrix.archive }}

      - name: Generate checksum
        shell: bash
        run: |
          sha256sum fcon-${{ matrix.rid }}.${{ matrix.archive }} > fcon-${{ matrix.rid }}.${{ matrix.archive }}.sha256 || \
          shasum -a 256 fcon-${{ matrix.rid }}.${{ matrix.archive }} > fcon-${{ matrix.rid }}.${{ matrix.archive }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: fcon-${{ matrix.rid }}
          path: |
            fcon-${{ matrix.rid }}.${{ matrix.archive }}
            fcon-${{ matrix.rid }}.${{ matrix.archive }}.sha256

  npm-publish:
    # Depends on github-prerelease so that the GitHub Release with binaries exists
    # BEFORE @flowconsole/cli is published to npm. Otherwise, any `npm install
    # @flowconsole/cli@next` between the two job completions would 404 in postinstall.js.
    needs: [version, build, github-prerelease]
    if: needs.version.outputs.no_changes != 'true'
    runs-on: ubuntu-latest
    # NPM_TOKEN lives in the `release` environment (per repo settings).
    environment:
      name: release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version
        run: |
          cd packages/cli
          npm version "$NPM_VERSION" --no-git-tag-version
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.cliVersion = process.env.CLI_VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
        env:
          NPM_VERSION: ${{ needs.version.outputs.npm_version }}
          CLI_VERSION: ${{ needs.version.outputs.cli_version }}

      - name: Publish to npm
        run: pnpm --filter @flowconsole/cli publish --tag next --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-prerelease:
    needs: [version, build]
    if: needs.version.outputs.no_changes != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Download preview notes
        uses: actions/download-artifact@v8
        with:
          name: preview-notes
          path: .

      - name: Build release notes
        run: |
          ARTIFACTS_TABLE="| Platform | Archive | Checksum |\n|----------|---------|----------|"
          for dir in artifacts/fcon-*/; do
            RID=$(basename "$dir" | sed 's/^fcon-//')
            for archive in "$dir"fcon-*.tar.gz "$dir"fcon-*.zip; do
              if [[ -f "$archive" ]]; then
                ARCHIVE_NAME=$(basename "$archive")
                CHECKSUM=""
                if [[ -f "${archive}.sha256" ]]; then
                  CHECKSUM=$(awk '{print $1}' "${archive}.sha256")
                fi
                case "$RID" in
                  linux-x64)   PLATFORM="Linux x64" ;;
                  linux-arm64) PLATFORM="Linux ARM64" ;;
                  osx-x64)     PLATFORM="macOS x64" ;;
                  osx-arm64)   PLATFORM="macOS ARM64" ;;
                  win-x64)     PLATFORM="Windows x64" ;;
                  win-arm64)   PLATFORM="Windows ARM64" ;;
                  *)           PLATFORM="$RID" ;;
                esac
                ARTIFACTS_TABLE="${ARTIFACTS_TABLE}\n| ${PLATFORM} | ${ARCHIVE_NAME} | ${CHECKSUM} |"
              fi
            done
          done

          {
            echo "## FlowConsole CLI ${CLI_VERSION}"
            echo ""
            echo "Automatic preview build from \`dev\` branch."
            echo ""
            echo "### Changes"
            cat preview-notes.md 2>/dev/null || true
            echo ""
            echo "### Artifacts"
            echo ""
            printf '%b\n' "$ARTIFACTS_TABLE"
            echo ""
            echo "> **Warning:** This is a preview build. Not for production use."
          } > release-body.md
        env:
          CLI_VERSION: ${{ needs.version.outputs.cli_version }}

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          for dir in artifacts/fcon-*/; do
            cp "$dir"fcon-*.tar.gz "$dir"fcon-*.zip "$dir"fcon-*.sha256 release-assets/ 2>/dev/null || true
          done

      - name: Create GitHub pre-release
        run: |
          if ! compgen -G "release-assets/*" > /dev/null; then
            echo "ERROR: No release assets found in release-assets/" >&2
            exit 1
          fi

          gh release create "$TAG" \
            --prerelease \
            --title "FlowConsole CLI ${CLI_VERSION}" \
            --notes-file release-body.md \
            release-assets/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          CLI_VERSION: ${{ needs.version.outputs.cli_version }}

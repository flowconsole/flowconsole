name: CLI Release Smoke (npm)

# Triggered manually or after CLI release to verify npm wrapper on all platforms
on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: 'npm package version to test (e.g., 2.0.0-0.2.0-beta)'
        required: true
        type: string

jobs:
  npm-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-x64
            os: macos-13
          - rid: osx-arm64
            os: macos-latest
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-11-arm

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install @flowconsole/cli
        run: npm install -g @flowconsole/cli@${{ inputs.cli_version }}

      - name: Smoke test - fcon --version
        shell: bash
        run: |
          VERSION=$(fcon --version)
          echo "Reported version: $VERSION"
          [ -n "$VERSION" ] || { echo "ERROR: --version returned empty"; exit 1; }

      - name: Smoke test - fcon --help
        run: fcon --help

      - name: Smoke test - fcon scan --help
        run: fcon scan --help

      - name: Smoke test - fcon validate --help
        run: fcon validate --help

      - name: Smoke test - fcon push --help
        run: fcon push --help

      - name: Smoke test - fcon diff --help
        run: fcon diff --help

      - name: Smoke test - fcon telemetry status
        env:
          DO_NOT_TRACK: '1'
        run: fcon telemetry status

      - name: Smoke test - fcon view --help
        run: fcon view --help

      - name: Checkout (for fixture files)
        if: runner.os == 'Linux'
        uses: actions/checkout@v5
        with:
          sparse-checkout: contracts/model-snapshot/v1/conformance/valid

      - name: Smoke test - fcon view (local server)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cleanup_viewer() {
            CHILD_PIDS=$(pgrep -P "$FCON_PID" 2>/dev/null || true)
            for cpid in $CHILD_PIDS; do
              kill "$cpid" 2>/dev/null || true
            done
            kill "$FCON_PID" 2>/dev/null || true
            wait "$FCON_PID" 2>/dev/null || true
          }
          trap cleanup_viewer EXIT

          FIXTURE="contracts/model-snapshot/v1/conformance/valid/minimal.json"
          fcon view "$FIXTURE" --no-open --port 0 2>viewer_stderr.log &
          FCON_PID=$!
          sleep 3

          PORT=$(grep -oP 'Listening on http://127\.0\.0\.1:\K[0-9]+' viewer_stderr.log || true)
          if [ -z "$PORT" ]; then
            CHILD_PID=$(pgrep -P "$FCON_PID" 2>/dev/null | head -1 || true)
            SEARCH_PID="${CHILD_PID:-$FCON_PID}"
            PORT=$(ss -tlnp 2>/dev/null | grep "$SEARCH_PID" | grep -oP '127\.0\.0\.1:\K[0-9]+' | head -1 || true)
          fi
          if [ -z "$PORT" ]; then
            echo "::error::Could not detect viewer port"
            cat viewer_stderr.log
            exit 1
          fi

          BASE="http://127.0.0.1:$PORT"

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/")
          echo "GET / -> $HTTP_CODE"
          [ "$HTTP_CODE" = "200" ] || { echo "::error::GET / returned $HTTP_CODE"; exit 1; }

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/api/snapshot")
          echo "GET /api/snapshot -> $HTTP_CODE"
          [ "$HTTP_CODE" = "200" ] || { echo "::error::GET /api/snapshot returned $HTTP_CODE"; exit 1; }

          CACHE_HEADER=$(curl -s -D - -o /dev/null "$BASE/api/snapshot" | grep -i "cache-control" | tr -d '\r')
          echo "Cache-Control: $CACHE_HEADER"

          echo "fcon view smoke test passed"

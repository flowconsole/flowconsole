name: SDK Preview Release

on:
  push:
    branches: [dev]
    paths:
      - "packages/sdk/**"
  workflow_dispatch:

concurrency:
  group: sdk-preview
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

env:
  # Skip @flowconsole/cli postinstall download (chicken-and-egg in CI:
  # @flowconsole/cli is a workspace dep but its binary isn't published yet for this build).
  FLOWCONSOLE_CLI_SKIP_DOWNLOAD: "1"

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Setup Python (for publib-pypi → twine)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup .NET (for publib-nuget)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # Setup Java disabled while Maven publish is commented out.
      # Re-enable together with the "Publish to Maven Central" step below.
      # - name: Setup Java (for publib-maven → gpg + maven)
      #   uses: actions/setup-java@v5
      #   with:
      #     distribution: temurin
      #     java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate preview changeset from git history
        id: changeset
        run: |
          bash .github/scripts/generate-preview-changeset.sh \
            --package @flowconsole/sdk \
            --paths 'packages/sdk' \
            --tag-pattern 'sdk-preview-*'

      - name: Check for changes
        if: steps.changeset.outputs.no_changes == 'true'
        run: echo "No SDK changes since last preview tag. Skipping publish."

      - name: Generate snapshot versions
        if: steps.changeset.outputs.no_changes != 'true'
        # Dot-separator template (beta.{ts}) is required by jsii-pacmak Python target (PEP 440).
        run: pnpm changeset version --snapshot beta --snapshot-prerelease-template '{tag}.{datetime}'

      - name: Build SDK
        if: steps.changeset.outputs.no_changes != 'true'
        run: pnpm --filter @flowconsole/sdk build

      - name: Test SDK
        if: steps.changeset.outputs.no_changes != 'true'
        run: pnpm --filter @flowconsole/sdk test

      - name: Package jsii artifacts
        if: steps.changeset.outputs.no_changes != 'true'
        run: pnpm --filter @flowconsole/sdk package

      # ----- Publishing via publib (formerly jsii-release, AWS jsii ecosystem standard) -----

      - name: Publish to npm (OIDC Trusted Publisher)
        if: steps.changeset.outputs.no_changes != 'true'
        working-directory: packages/sdk
        # Auth via npm Trusted Publisher (configured for @flowconsole/sdk). publib reads
        # NPM_PROVENANCE/NPM_TOKEN env vars; with provenance enabled and no token, the
        # underlying `npm publish` exchanges the GitHub OIDC token automatically.
        # publib-* are bin entries of the `publib` package; -p makes npx fetch the right pkg.
        run: npx -y -p publib publib-npm
        env:
          NPM_DIST_TAG: beta
          NPM_PROVENANCE: "true"

      - name: Publish to PyPI
        if: steps.changeset.outputs.no_changes != 'true'
        working-directory: packages/sdk
        run: npx -y -p publib publib-pypi
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

      - name: Publish to NuGet
        if: steps.changeset.outputs.no_changes != 'true'
        working-directory: packages/sdk
        run: npx -y -p publib publib-nuget
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      # Maven Central publishing disabled until namespace `io.github.flowconsole`
      # is verified on https://central.sonatype.com/publishing/namespaces and
      # GPG keypair is provisioned. See TODO.md.
      #
      # Required secrets when re-enabling:
      #   - MAVEN_USERNAME / MAVEN_PASSWORD (User Token from central.sonatype.com/account)
      #   - MAVEN_GPG_PRIVATE_KEY (gpg --armor --export-secret-keys <KEY_ID>)
      #   - MAVEN_GPG_PASSPHRASE
      # Also re-enable the "Setup Java" step at the top of this job.
      #
      # - name: Publish to Maven Central
      #   if: steps.changeset.outputs.no_changes != 'true'
      #   working-directory: packages/sdk
      #   run: npx -y -p publib publib-maven
      #   env:
      #     MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      #     MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      #     MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      #     MAVEN_GPG_PRIVATE_KEY_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      #     MAVEN_ENDPOINT: https://central.sonatype.com
      #     MAVEN_SERVER_ID: central

      - name: Publish Go module
        if: steps.changeset.outputs.no_changes != 'true'
        working-directory: packages/sdk
        run: npx -y -p publib publib-golang
        env:
          GITHUB_TOKEN: ${{ secrets.GO_REPO_TOKEN }}
          GIT_USER_NAME: FlowConsole CI
          GIT_USER_EMAIL: github@flowconsole.tech

      # ----- GitHub pre-release with release notes -----

      - name: Create GitHub pre-release
        if: steps.changeset.outputs.no_changes != 'true'
        run: |
          set -euo pipefail

          SDK_VERSION=$(node -p "require('./packages/sdk/package.json').version")
          SNAPSHOT_SUFFIX="${SDK_VERSION##*-beta.}"
          if [[ "$SNAPSHOT_SUFFIX" == "$SDK_VERSION" ]]; then
            echo "ERROR: could not extract snapshot suffix from '${SDK_VERSION}'" >&2
            exit 1
          fi
          TAG="sdk-preview-${SNAPSHOT_SUFFIX}"

          WEB_VERSION=$(node -p "require('./packages/web/package.json').version")
          SDK_BASE="${SDK_VERSION%-beta.*}"

          {
            echo "## SDK Preview ${SDK_VERSION}"
            echo ""
            echo "Automatic preview build from \`dev\` branch."
            echo ""
            echo "### Changes"
            cat preview-notes.md 2>/dev/null || true
            echo ""
            echo "### Published Packages"
            echo ""
            echo "| Registry | Package | Version |"
            echo "|----------|---------|---------|"
            echo "| npm | @flowconsole/sdk | ${SDK_VERSION} |"
            echo "| npm | @flowconsole/web | ${WEB_VERSION} (not published) |"
            echo "| PyPI | flowconsole-sdk | ${SDK_BASE}b${SNAPSHOT_SUFFIX} |"
            echo "| Maven | io.github.flowconsole:flowconsole-sdk | ${SDK_VERSION} (not published — namespace pending verification) |"
            echo "| NuGet | FlowConsole.Sdk | ${SDK_VERSION} |"
            echo "| Go | github.com/flowconsole/go-flowconsole | @main (latest commit) |"
            echo ""
            echo "> **Warning:** This is a preview build. Install npm packages with the \`beta\` tag."
          } > release-body.md

          ASSETS=()
          for lang in java python dotnet; do
            ARCHIVE="sdk-dist-${lang}.tar.gz"
            if [[ -d "packages/sdk/dist/${lang}" ]]; then
              tar -czf "$ARCHIVE" -C packages/sdk/dist "$lang"
              if [[ -s "$ARCHIVE" ]]; then
                ASSETS+=("$ARCHIVE")
              else
                echo "WARNING: $ARCHIVE is empty, skipping" >&2
                rm -f "$ARCHIVE"
              fi
            else
              echo "WARNING: packages/sdk/dist/${lang} not found, skipping $ARCHIVE" >&2
            fi
          done

          if [[ ${#ASSETS[@]} -eq 0 ]]; then
            echo "ERROR: No jsii dist artifacts found" >&2
            exit 1
          fi

          gh release create "$TAG" \
            --prerelease \
            --title "SDK Preview ${SDK_VERSION}" \
            --notes-file release-body.md \
            "${ASSETS[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

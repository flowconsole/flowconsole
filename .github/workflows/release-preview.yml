name: SDK Preview Release

on:
  push:
    branches: [dev]
    paths:
      - "packages/sdk/**"
  workflow_dispatch:

concurrency:
  group: sdk-preview
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

env:
  # Skip @flowconsole/cli postinstall download (chicken-and-egg in CI:
  # @flowconsole/cli is a workspace dep but its binary isn't published yet for this build).
  FLOWCONSOLE_CLI_SKIP_DOWNLOAD: "1"

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate preview changeset from git history
        id: changeset
        run: |
          bash .github/scripts/generate-preview-changeset.sh \
            --package @flowconsole/sdk \
            --paths 'packages/sdk' \
            --tag-pattern 'sdk-preview-*'

      - name: Check for changes
        if: steps.changeset.outputs.no_changes == 'true'
        run: |
          echo "No SDK changes since last preview tag. Skipping publish."

      - name: Generate snapshot versions
        if: steps.changeset.outputs.no_changes != 'true'
        
        run: pnpm changeset version --snapshot beta --snapshot-prerelease-template '{tag}.{datetime}'

      - name: Build SDK
        if: steps.changeset.outputs.no_changes != 'true'
        run: pnpm --filter @flowconsole/sdk build

      - name: Test SDK
        if: steps.changeset.outputs.no_changes != 'true'
        run: pnpm --filter @flowconsole/sdk test

      - name: Package jsii artifacts
        if: steps.changeset.outputs.no_changes != 'true'
        run: pnpm --filter @flowconsole/sdk package

      - name: Publish to npm
        if: steps.changeset.outputs.no_changes != 'true'
        run: pnpm --filter @flowconsole/sdk publish --tag beta --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to PyPI
        if: steps.changeset.outputs.no_changes != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/sdk/dist/python

      - name: Setup .NET
        if: steps.changeset.outputs.no_changes != 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Publish to NuGet
        if: steps.changeset.outputs.no_changes != 'true'
        run: |
          dotnet nuget push packages/sdk/dist/dotnet/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Setup Java
        if: steps.changeset.outputs.no_changes != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Publish to Maven Central (snapshots)
        if: steps.changeset.outputs.no_changes != 'true'
        run: |
          set -euo pipefail

          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'SETTINGS_EOF'
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${env.MAVEN_USERNAME}</username>
                <password>${env.MAVEN_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          SETTINGS_EOF

          # jsii-pacmak emits a Maven repository layout under dist/java/<groupId>/<artifactId>/<version>/.
          # There is NO root pom.xml, so plain `mvn deploy` does not apply.
          # We walk the layout and run `mvn deploy:deploy-file` per artifact.
          # MAVEN_USERNAME / MAVEN_PASSWORD = User Token from https://central.sonatype.com/account
          REPO_URL="https://central.sonatype.com/repository/maven-snapshots/"
          DIST_DIR="packages/sdk/dist/java"

          POMS=$(find "$DIST_DIR" -name "*.pom" | sort)
          if [[ -z "$POMS" ]]; then
            echo "ERROR: no .pom files found under $DIST_DIR" >&2
            exit 1
          fi

          while IFS= read -r POM; do
            DIR=$(dirname "$POM")
            BASE=$(basename "$POM" .pom)
            JAR="$DIR/$BASE.jar"
            SOURCES="$DIR/${BASE}-sources.jar"
            JAVADOC="$DIR/${BASE}-javadoc.jar"

            ARGS=(
              deploy:deploy-file
              -DrepositoryId=central
              -Durl="$REPO_URL"
              -DpomFile="$POM"
            )
            [[ -f "$JAR" ]] && ARGS+=( -Dfile="$JAR" ) || ARGS+=( -Dfile="$POM" )
            [[ -f "$SOURCES" ]] && ARGS+=( -Dsources="$SOURCES" )
            [[ -f "$JAVADOC" ]] && ARGS+=( -Djavadoc="$JAVADOC" )

            echo "Deploying $BASE to $REPO_URL"
            mvn "${ARGS[@]}"
          done <<< "$POMS"
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Publish Go module
        if: steps.changeset.outputs.no_changes != 'true'
        run: |
          set -e
          SDK_VERSION=$(node -p "require('./packages/sdk/package.json').version")

          # jsii-pacmak emits Go module under dist/go/<packageName>/
          # (packageName = "flowconsole" per packages/sdk/package.json jsii config).
          # The module path inside go.mod is github.com/flowconsole/go-flowconsole — points
          # to a SEPARATE repo that this step force-pushes to.
          cd packages/sdk/dist/go/flowconsole

          git init -q
          git config user.email "github@flowconsole.tech"
          git config user.name "FlowConsole CI"

          # Force-push to main of go-flowconsole. Consumers do:
          #   go get github.com/flowconsole/go-flowconsole@main
          # Go toolchain resolves to a pseudo-version v0.0.0-{utc}-{sha} automatically.
          # No tag = no Go proxy cache pinning gotchas.
          git remote add origin "https://x-access-token:${GO_REPO_TOKEN}@github.com/flowconsole/go-flowconsole.git"
          git checkout -q -b main
          git add -A
          git commit -q -m "preview: ${SDK_VERSION} (from flowconsole/flowconsole@${GITHUB_SHA::7})"
          git push -q --force origin main

          # OPTIONAL: also force-push a v0.0.0-preview tag (uncomment if you want consumers
          # to use `@v0.0.0-preview` instead of `@main`). Note: Go module proxy may serve
          # stale data for force-pushed tags — `@main` is safer for preview.
          # git tag -f v0.0.0-preview
          # git push -q --force --tags origin
        env:
          GO_REPO_TOKEN: ${{ secrets.GO_REPO_TOKEN }}

      - name: Create GitHub pre-release
        if: steps.changeset.outputs.no_changes != 'true'
        run: |
          SDK_VERSION=$(node -p "require('./packages/sdk/package.json').version")
          SNAPSHOT_SUFFIX="${SDK_VERSION##*-beta.}"
          if [[ "$SNAPSHOT_SUFFIX" == "$SDK_VERSION" ]]; then
            echo "ERROR: could not extract snapshot suffix from '${SDK_VERSION}'" >&2
            exit 1
          fi
          TAG="sdk-preview-${SNAPSHOT_SUFFIX}"

          WEB_VERSION=$(node -p "require('./packages/web/package.json').version")

          PYPI_SUFFIX="$SNAPSHOT_SUFFIX"
          SDK_BASE="${SDK_VERSION%-beta.*}"

          MAVEN_VERSION="$SDK_VERSION"

          {
            echo "## SDK Preview ${SDK_VERSION}"
            echo ""
            echo "Automatic preview build from \`dev\` branch."
            echo ""
            echo "### Changes"
            cat preview-notes.md 2>/dev/null || true
            echo ""
            echo "### Published Packages"
            echo ""
            echo "| Registry | Package | Version |"
            echo "|----------|---------|---------|"
            echo "| npm | @flowconsole/sdk | ${SDK_VERSION} |"
            echo "| npm | @flowconsole/web | ${WEB_VERSION} (not published) |"
            echo "| PyPI | flowconsole-sdk | ${SDK_BASE}b${PYPI_SUFFIX} |"
            echo "| Maven | io.github.flowconsole:flowconsole-sdk | ${MAVEN_VERSION} |"
            echo "| NuGet | FlowConsole.Sdk | ${SDK_VERSION} |"
            echo "| Go | github.com/flowconsole/go-flowconsole | @main (latest commit) |"
            echo ""
            echo "> **Warning:** This is a preview build. Install npm packages with the \`beta\` tag."
          } > release-body.md

          ASSETS=()
          for lang in java python dotnet; do
            ARCHIVE="sdk-dist-${lang}.tar.gz"
            if [[ -d "packages/sdk/dist/${lang}" ]]; then
              tar -czf "$ARCHIVE" -C packages/sdk/dist "$lang"
              if [[ -s "$ARCHIVE" ]]; then
                ASSETS+=("$ARCHIVE")
              else
                echo "WARNING: $ARCHIVE is empty, skipping" >&2
                rm -f "$ARCHIVE"
              fi
            else
              echo "WARNING: packages/sdk/dist/${lang} not found, skipping $ARCHIVE" >&2
            fi
          done

          if [[ ${#ASSETS[@]} -eq 0 ]]; then
            echo "ERROR: No jsii dist artifacts found" >&2
            exit 1
          fi

          gh release create "$TAG" \
            --prerelease \
            --title "SDK Preview ${SDK_VERSION}" \
            --notes-file release-body.md \
            "${ASSETS[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

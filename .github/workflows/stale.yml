name: Stale issues and PRs

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'pinned,security,critical,help-wanted,roadmap'
          exempt-pr-labels: 'pinned,security,critical,work-in-progress'
          exempt-all-milestones: true
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had recent activity.
            It will be closed in 14 days if no further activity occurs. Add a comment or remove the
            `stale` label to keep it open.
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has not had recent
            activity. It will be closed in 14 days if no further activity occurs. Push a commit,
            comment, or remove the `stale` label to keep it open.
          close-issue-message: |
            This issue was closed because it has been stale for 14 days with no activity.
            Feel free to reopen if it is still relevant.
          close-pr-message: |
            This pull request was closed because it has been stale for 14 days with no activity.
            Feel free to reopen if you would like to continue the work.
          operations-per-run: 100

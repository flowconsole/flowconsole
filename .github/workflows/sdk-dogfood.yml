name: SDK Dogfood Validation

on:
  pull_request:
    paths:
      - 'src/sdk/**'
      - 'examples/self-architecture/**'
      - 'contracts/model-snapshot/**'
  workflow_dispatch:

jobs:
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: cd src/sdk && pnpm install

      - name: Build SDK
        run: cd src/sdk && pnpm build

      - name: Generate jsii C# bindings
        run: cd src/sdk && HOME=/tmp npx jsii-pacmak --targets dotnet

      - name: Run SDK tests
        run: cd src/sdk && pnpm test

      # TS dogfood
      - name: Install tsx
        run: npm install -g tsx

      - name: Run TS dogfood
        working-directory: examples/self-architecture
        run: |
          npm install @flowconsole/sdk@file:../../src/sdk
          npx tsx flowconsole-arch.ts > ts-output.json
          echo "TS dogfood output generated ($(wc -l < ts-output.json) lines)"

      - name: Validate TS output schema
        working-directory: examples/self-architecture
        run: |
          # Basic JSON validation
          python3 -c "import json; d=json.load(open('ts-output.json')); assert d['schemaVersion']=='1.1.0'; assert d['source']=='Git'; assert len(d['elements'])>0; print(f'Valid: {len(d[\"elements\"])} elements, {len(d[\"relationships\"])} relationships, {len(d.get(\"flows\") or [])} flows')"

      # C# dogfood
      - name: Add local NuGet source
        run: dotnet nuget add source ${{ github.workspace }}/src/sdk/dist/dotnet/ --name flowconsole-local

      - name: Restore C# dogfood
        working-directory: examples/self-architecture
        run: dotnet restore

      - name: Run C# dogfood
        working-directory: examples/self-architecture
        run: |
          dotnet run --project . > cs-output.json
          echo "C# dogfood output generated ($(wc -l < cs-output.json) lines)"

      # Byte-compare
      - name: Byte-compare TS vs C# output
        working-directory: examples/self-architecture
        run: |
          if diff ts-output.json cs-output.json; then
            echo "Byte-identical output"
          else
            echo "WARNING: Outputs differ (see diff above)"
            echo "This may be expected due to jsii serialization quirks"
            # Non-blocking for now — document differences
            exit 0
          fi

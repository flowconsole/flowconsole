name: Engine CI

on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - '.github/workflows/engine-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'engine/**'
      - '.github/workflows/engine-ci.yml'
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION_PATH: engine/src/FlowConsole.slnx

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} --no-build --verbosity quiet

      - name: Lint (format check)
        run: dotnet format ${{ env.SOLUTION_PATH }} --verify-no-changes --verbosity diagnostic

  cli-cross-platform:
    needs: build-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Publish SFA (${{ matrix.rid }})
        run: |
          dotnet publish engine/src/FlowConsole.Cli/FlowConsole.Cli.csproj -r ${{ matrix.rid }} -c Release -o artifacts/${{ matrix.rid }}

      - name: Smoke test - fcon --version
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            FC="artifacts/${{ matrix.rid }}/fcon.exe"
          else
            chmod +x artifacts/${{ matrix.rid }}/fcon
            FC="artifacts/${{ matrix.rid }}/fcon"
          fi
          VERSION=$("$FC" --version)
          echo "Reported version: $VERSION"
          [ -n "$VERSION" ] || { echo "ERROR: --version returned empty"; exit 1; }

      - name: Smoke test - fcon scan
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then FC="artifacts/${{ matrix.rid }}/fcon.exe"; else FC="artifacts/${{ matrix.rid }}/fcon"; fi
          "$FC" scan contracts/model-snapshot/v1/conformance/valid/minimal.json

      - name: Smoke test - fcon validate
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then FC="artifacts/${{ matrix.rid }}/fcon.exe"; else FC="artifacts/${{ matrix.rid }}/fcon"; fi
          "$FC" validate contracts/model-snapshot/v1/conformance/valid/minimal.json

  sfa-publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64, osx-x64, osx-arm64, win-x64, win-arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Publish SFA (${{ matrix.rid }})
        run: |
          dotnet publish engine/src/FlowConsole.Cli/FlowConsole.Cli.csproj \
            -r ${{ matrix.rid }} \
            -c Release \
            -o artifacts/${{ matrix.rid }}

      - name: Upload SFA artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcon-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/

  sfa-smoke-test:
    needs: sfa-publish
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
          - rid: win-x64
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download SFA artifact
        uses: actions/download-artifact@v4
        with:
          name: fcon-${{ matrix.rid }}
          path: fcon-bin/

      - name: Make binary executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x fcon-bin/fcon

      - name: Smoke test - fcon --version
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then FC="fcon-bin/fcon.exe"; else FC="fcon-bin/fcon"; fi
          VERSION=$("$FC" --version)
          echo "Reported version: $VERSION"
          [ -n "$VERSION" ] || { echo "ERROR: --version returned empty"; exit 1; }

      - name: Smoke test - fcon scan
        run: |
          ${{ runner.os == 'Windows' && 'fcon-bin\fcon.exe' || 'fcon-bin/fcon' }} scan contracts/model-snapshot/v1/conformance/valid/minimal.json
        continue-on-error: false

      - name: Smoke test - fcon validate
        run: |
          ${{ runner.os == 'Windows' && 'fcon-bin\fcon.exe' || 'fcon-bin/fcon' }} validate contracts/model-snapshot/v1/conformance/valid/minimal.json
        continue-on-error: false

      - name: Smoke test - fcon explain
        run: |
          ${{ runner.os == 'Windows' && 'fcon-bin\fcon.exe' || 'fcon-bin/fcon' }} rules list
        continue-on-error: false

      - name: Smoke test - fcon fmt
        run: |
          cp contracts/model-snapshot/v1/conformance/valid/minimal.json /tmp/test-fmt.json 2>/dev/null || copy contracts\model-snapshot\v1\conformance\valid\minimal.json %TEMP%\test-fmt.json
          ${{ runner.os == 'Windows' && 'fcon-bin\fcon.exe' || 'fcon-bin/fcon' }} fmt ${{ runner.os == 'Windows' && '%TEMP%\test-fmt.json' || '/tmp/test-fmt.json' }}
        continue-on-error: false

  nuget-pack:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Pack NuGet tool
        run: |
          dotnet pack engine/src/FlowConsole.Cli/FlowConsole.Cli.csproj \
            -c Release \
            -o artifacts/nuget

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/nuget/*.nupkg

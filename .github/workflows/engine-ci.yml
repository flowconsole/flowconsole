name: Engine CI

on:
  push:
    branches:
      - dev
      - 'feature/**'
    paths:
      - 'engine/**'
      - 'packages/viewer/**'
      - 'packages/web/**'
      - '.github/workflows/engine-ci.yml'
  pull_request:
    branches:
      - dev
    paths:
      - 'engine/**'
      - 'packages/viewer/**'
      - 'packages/web/**'
      - '.github/workflows/engine-ci.yml'
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION_PATH: engine/src/FlowConsole.slnx

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build viewer SPA
        run: pnpm build:viewer

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} --no-build --verbosity quiet

      - name: Lint (format check)
        run: dotnet format ${{ env.SOLUTION_PATH }} --verify-no-changes --verbosity diagnostic

apiVersion: rules.flowconsole.tech/v1alpha1
kind: RuleFile
rules:
  - id: no-orphan-elements
    name: No orphan elements
    kind: element
    target: actual
    severity: warning
    blocking: false
    description: Elements without a parent should have at least one relationship.
    tags:
      - governance
      - structural
    subject:
      entity: elements
      where: "!has(item.ParentId)"
    mode: perItem
    assert: count(incoming(item)) + count(outgoing(item)) > 0
    message: "Element '${item.Name}' (${item.Kind}) is orphaned — no relationships"

workflow: GitFlow/v1
mode: ContinuousDelivery
branches:
  feat:
    mode: ContinuousDelivery
  release:
    mode: ContinuousDelivery
    label: 'rc'
  hotfix:
    mode: ContinuousDelivery
    label: 'hotfix'
  dev:
    label: 'dev'
    mode: ContinuousDelivery
  main:
    mode: ContinuousDeployment
  unknown:
    mode: ContinuousDelivery